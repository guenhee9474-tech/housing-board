<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>우리 집 후보 현황판</title>
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;--border:rgba(11,11,11,.12);--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink-2:#c3c2b7;--muted:#898781;--border:rgba(255,255,255,.12);--accent:#3987e5}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);
font:15px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding:24px 16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:var(--ink-2);font-size:13.5px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--page);color:inherit}
label.remember{display:flex;gap:8px;align-items:center;margin:12px 0 16px;color:var(--ink-2);font-size:13.5px}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:10px;background:var(--ink);color:var(--page);cursor:pointer}
button:disabled{opacity:.6}.err{color:#d03b3b;min-height:20px;margin:10px 0 0;font-size:13px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>
<form id="f" autocomplete="on">

  <label class="remember"><input id="remember" type="checkbox" checked> 이 기기에서 기억</label>
  <button id="go" type="submit">열기</button>
  <div class="err" id="err" role="alert"></div>
</form>

  const blob = b64(PAYLOAD), iv = blob.slice(0, 12), ct = blob.slice(12);
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
